name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Test
        shell: pwsh
        run: ./test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: UnityLogFinder-Windows
          path: dist/UnityLogFinder.exe
